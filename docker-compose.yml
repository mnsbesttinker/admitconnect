version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: admitconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admitconnect
      POSTGRES_PASSWORD: admitconnect
      POSTGRES_DB: admitconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
